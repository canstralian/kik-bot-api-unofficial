name: CI

on:
  push:
    branches:
      - new
      - "fix/**"
  pull_request:
    branches:
      - new
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified tag
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7, verified tag
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install .
      - name: Resolve dependency compatibility
        run: python -m pip check
      - name: Dependency advisory audit (blocking)
        run: |
          python -m pip install "pip-audit>=2.9,<3"
          # The fork's local distribution is not published on PyPI; audit
          # all installed third-party distributions, never silently ignore advisories.
          python -m pip freeze | grep -Eiv '^kik[-_]unofficial([ =@]|$)' > "$RUNNER_TEMP/third-party-requirements.txt"
          python -m pip_audit --strict -r "$RUNNER_TEMP/third-party-requirements.txt"
      - name: Offline unit tests (no Kik credentials or live service)
        run: python -m unittest discover -s tests -v
      - name: Build distribution artifacts
        run: python -m build --sdist --wheel
      - name: Validate artifact metadata
        run: python -m twine check dist/*
      - name: Docker image build (Python 3.11)
        if: matrix.python-version == '3.11'
        run: docker build --tag kik-unofficial:ci .
      - name: Validate installed-wheel import
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import kik_unofficial.client, kik_unofficial.connection_policy; print('wheel import passed')"
