name: CI

on:
  push:
    branches:
      - new
      - "fix/**"
  pull_request:
    branches:
      - new
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install .
      - name: Resolve dependency compatibility
        run: python -m pip check
      - name: Dependency advisory audit (blocking)
        run: |
          python -m pip install "pip-audit>=2.9,<3"
          python -m pip_audit --strict
      - name: Offline unit tests (no Kik credentials or live service)
        run: python -m unittest discover -s tests -v
      - name: Build distribution artifacts
        run: python -m build --sdist --wheel
      - name: Validate artifact metadata
        run: python -m twine check dist/*
      - name: Validate installed-wheel import
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import kik_unofficial.client, kik_unofficial.connection_policy; print('wheel import passed')"
